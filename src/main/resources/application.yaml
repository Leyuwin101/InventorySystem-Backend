spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: InventorySystem-Backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      data-source-properties:
        prepareThreshold: 0

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  output:
    ansi:
      enabled: ALWAYS

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024

logging:
  level:
    root: INFO
    com.example.inventorysystembackend: DEBUG
    com.zaxxer.hikari: INFO
    org.springframework.jdbc.datasource: INFO
    org.hibernate.orm.connections: INFO

  file:
    name: logs/app.log

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET}