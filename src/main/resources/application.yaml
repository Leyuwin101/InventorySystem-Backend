spring:
  application:
    name: InventorySystem-Backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  output:
    ansi:
      enabled: ALWAYS

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.example.inventorysystembackend: DEBUG
    com.zaxxer.hikari: INFO
    org.springframework.jdbc.datasource: INFO
    org.hibernate.orm.connections: INFO

  file:
    name: logs/app.log

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%level] [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET}